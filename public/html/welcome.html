<body class="bg-[#060e20] text-on-surface min-h-screen flex items-center justify-center relative p-6 antialiased">
    
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute inset-0 stage-effect"></div>
        <div class="absolute inset-0 grid-bg-elite"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[80vw] h-[80vw] bg-primary/10 rounded-full blur-[200px] elite-pulse"></div>
        <div class="absolute -top-[15%] -right-[10%] w-[60%] h-[60%] bg-primary/8 rounded-full blur-[180px] animate-pulse"></div>
        <div class="absolute -bottom-[20%] -left-[10%] w-[70%] h-[70%] bg-tertiary/10 rounded-full blur-[200px] animate-float"></div>
    </div>

    <main class="relative z-10 w-full max-w-lg">
        <div class="text-center mb-16 space-y-6">
            <h1 class="font-headline-xl text-headline-xl brand-glow bg-gradient-to-br from-primary via-on-surface to-primary-fixed bg-clip-text text-transparent select-none">CHAT_SYSTEM</h1>
            <p class="font-body-sm text-on-surface/40 uppercase tracking-[0.4em] text-[10px] font-bold">Synchronized Communication Architecture</p>
        </div>
        <div class="glass-panel rounded-[3rem] p-10 md:p-14 auth-transition">

        <div class="flex p-1.5 bg-black/50 rounded-[1.5rem] mb-12 border border-white/5 shadow-2xl">
            <button class="flex-1 py-4 font-label-md text-label-md tracking-[0.2em] transition-all duration-700 rounded-[1.25rem] text-primary bg-primary/15 border border-primary/25 shadow-[0_0_25px_rgba(78,222,163,0.2)]" id="toggle-signin" onclick="switchAuth('signin')">LOGIN</button>
            <button class="flex-1 py-4 font-label-md text-label-md tracking-[0.2em] transition-all duration-700 rounded-[1.25rem] text-on-surface/30 hover:text-on-surface" id="toggle-signup" onclick="switchAuth('signup')">REGISTER</button>
        </div>
